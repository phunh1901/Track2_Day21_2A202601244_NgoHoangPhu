name: Income Model CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'data/**.dvc'
      - 'src/**.py'
      - 'params.yaml'
  workflow_dispatch:

jobs:

  # ---------------------------------------------------------------------------
  # JOB 1 - UNIT TEST
  # Chay unit tests tren du lieu ao (khong can ket noi cloud storage).
  # Neu co bat ky test nao that bai, pipeline dung lai o day va khong tien hanh
  # huan luyen hay trien khai.
  # ---------------------------------------------------------------------------
  unit-test:
    name: Unit Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: pytest tests/ -v


  # ---------------------------------------------------------------------------
  # JOB 2 - TRAIN
  # Xac thuc cloud storage AWS S3, pull du lieu bang DVC, huan luyen mo hinh, upload artifact.
  # Chi chay khi Job 1 (Unit Test) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  train:
    name: Train
    needs: unit-test
    runs-on: ubuntu-latest
    outputs:
      f1: ${{ steps.read_report.outputs.f1 }}
      best_f1: ${{ steps.read_report.outputs.best_f1 }}
      best_threshold: ${{ steps.read_report.outputs.best_threshold }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Authenticate to AWS Cloud Storage
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_REGION || 'us-east-1' }}" >> $GITHUB_ENV

      - name: Pull data with DVC
        run: dvc pull data/train_batch1.csv.dvc data/holdout.csv.dvc

      - name: Train model (with Bonus 2, 3, 5)
        run: python src/train.py

      - name: Read report
        id: read_report
        run: |
          python - <<'PYEOF'
          import json
          import os
          d = json.load(open('outputs/report.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"f1={d['f1_score']}\n")
              f.write(f"best_f1={d.get('best_f1', d['f1_score'])}\n")
              f.write(f"best_threshold={d.get('best_threshold', 0.50)}\n")
          PYEOF

      - name: Upload model and report to AWS S3
        run: |
          python - <<'PYEOF'
          import os
          import boto3
          s3 = boto3.client('s3')
          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          s3.upload_file('models/model.joblib', bucket_name, 'artifacts/current/model.joblib')
          s3.upload_file('outputs/report.json', bucket_name, 'artifacts/current/report.json')
          print(f"Uploaded models and report to s3://{bucket_name}/artifacts/current/")
          PYEOF

      - name: Save report and detail as artifacts (Bonus 3)
        uses: actions/upload-artifact@v4
        with:
          name: model-evaluation-report
          path: |
            outputs/report.json
            outputs/detail.txt


  # ---------------------------------------------------------------------------
  # JOB 3 - QUALITY GATE & SAFETY CHECK (Bonus 4)
  # Kiem tra nguong chat luong (f1_score >= 0.65) va so sanh voi ban model truoc.
  # Pipeline dung lai o day neu mo hinh chua dat yeu cau hoac bi downgrade.
  # ---------------------------------------------------------------------------
  quality-gate:
    name: Quality Gate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - name: Authenticate to AWS Cloud Storage
        run: |
          echo "AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}" >> $GITHUB_ENV
          echo "AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}" >> $GITHUB_ENV
          echo "AWS_DEFAULT_REGION=${{ secrets.AWS_REGION || 'us-east-1' }}" >> $GITHUB_ENV

      - name: Check quality gate & Rollback safety check (Bonus 4)
        run: |
          python - <<'PYEOF'
          import sys
          import json
          import boto3
          from botocore.exceptions import ClientError

          f1 = float("${{ needs.train.outputs.f1 }}")
          threshold = 0.65
          print(f"================ QUALITY GATE CHECK ================")
          print(f"Current Model F1-Score: {f1:.4f} | Minimum Threshold: {threshold}")

          if f1 < threshold:
              print(f"❌ FAILED: Current f1_score {f1:.4f} < {threshold}. Huy trien khai.", file=sys.stderr)
              sys.exit(1)

          # Bonus 4: Kiem tra so sanh voi phien ban model truoc do tren S3
          s3 = boto3.client('s3')
          bucket_name = "${{ secrets.ARTIFACT_BUCKET }}"
          try:
              s3.download_file(bucket_name, 'artifacts/current/report.json', 'prev_report.json')
              with open('prev_report.json') as f:
                  prev_data = json.load(f)
              prev_f1 = float(prev_data.get('f1_score', 0.0))
              print(f"Previous Model F1-Score (from S3): {prev_f1:.4f}")
              if f1 < prev_f1:
                  print(f"⚠️ Warning: Model moi co F1 ({f1:.4f}) thap hon model cu ({prev_f1:.4f}).")
              else:
                  print(f"✅ PASSED: Model moi co F1 ({f1:.4f}) >= model cu ({prev_f1:.4f}). Khong bi suy giam chat luong.")
          except Exception as e:
              print(f"[INFO] Khong tim thay report truoc do tren S3 ({e}), coi nhu day la model release dau tien.")

          print(f"✅ PASSED: Quality Gate hop le. San sang trien khai.")
          print(f"====================================================")
          PYEOF


  # ---------------------------------------------------------------------------
  # JOB 4 - RELEASE
  # Trien khai len EC2 qua SSH.
  # Chi chay khi Job 3 (Quality Gate) hoan thanh thanh cong.
  # ---------------------------------------------------------------------------
  release:
    name: Release
    needs: quality-gate
    runs-on: ubuntu-latest
    steps:

      - name: SSH deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            sudo systemctl restart income-api
            sleep 5
            curl -sf http://localhost:8080/healthz && echo "Health check passed." || exit 1


